# ponytail: stock bun image, no Dockerfile. Add one when the build needs system deps.
services:
  web:
    image: oven/bun:1
    working_dir: /app
    environment:
      DOCKER: "1"
    command: sh -c "bun install --frozen-lockfile && bun run dev --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
